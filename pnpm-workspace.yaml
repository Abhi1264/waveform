packages:
  - apps/*
  - packages/*

# Package scripts set environment variables inline (for example
# NEXT_TELEMETRY_DISABLED=1); the emulator makes that work on Windows too.
shellEmulator: true

catalog:
  "@axe-core/playwright": 4.11.0
  "@eslint/js": 10.0.1
  "@fontsource-variable/archivo": 5.3.0
  "@fontsource-variable/martian-mono": 5.3.0
  "@next/eslint-plugin-next": 16.3.8
  "@phosphor-icons/react": 2.1.10
  "@playwright/test": 1.63.0
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tauri-apps/api": 2.12.1
  "@tauri-apps/cli": 2.12.1
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/node": 26.6.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # TypeScript 7 provides `tsc`; tools that import the compiler API get the
  # TypeScript 6 API under the `typescript` name (ADR-013).
  "@typescript/native": npm:typescript@7.0.2
  "@vitejs/plugin-react": 6.1.1
  class-variance-authority: 0.7.1
  cn: 0.4.0
  eslint: 10.12.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  jsdom: 30.1.2
  mediabunny: 1.61.1
  next: 16.3.8
  prettier: 3.9.9
  prettier-plugin-tailwindcss: 0.8.1
  react: 19.3.0
  # The hook packages react-aria-components 1.21.1 itself depends on; keep them in step.
  react-aria: 3.52.1
  react-aria-components: 1.21.1
  react-dom: 19.3.0
  react-stately: 3.50.0
  shadcn: 4.21.1
  tailwindcss: 4.3.3
  turbo: 2.11.7
  tw-animate-css: 1.4.0
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.71.0
